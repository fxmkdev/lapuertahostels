services:
  redis:
    image: redis:8.4.8
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    logging:
      driver: none

  mongo:
    image: mongo:8.0.38
    ports:
      - "27017:27017"
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none

volumes:
  data:
  redis:
