name: "Setup"
description: Sets up PNPM and Node.js
runs:
  using: "composite"
  steps:
    - name: Install PNPM
      uses: pnpm/action-setup@v6
    - name: Set up Node.js with PNPM cache
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml
    - name: Verify Node.js and PNPM versions
      shell: bash
      run: |
        node --version
        pnpm --version
        test "$(node -p 'process.versions.node.split(".")[0]')" = "$NODE_VERSION"
        EXPECTED_PNPM_VERSION=$(node -p 'require("./package.json").packageManager.split("+")[0].slice("pnpm@".length)')
        test "$(pnpm --version)" = "$EXPECTED_PNPM_VERSION"
