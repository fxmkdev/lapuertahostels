name: Build
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release"
        required: false
        default: false
        type: boolean

      force_rebuild:
        description: "Rebuild and validate both images even when unchanged"
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: 26
  FLYCTL_VERSION: 0.5.11
  FRONTEND_INTERNAL_PORT: 3000
  CMS_INTERNAL_PORT: 3001

jobs:
  version:
    name: "Generate version"
    uses: ./.github/workflows/version.yml
    with:
      release: ${{ github.event.inputs.release }}

  ci-tests:
    name: "Build / CI: Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test scripts/ci/*.test.mjs

  detect-changes:
    name: "Detect affected apps"
    runs-on: ubuntu-latest
    needs: version
    outputs:
      frontend_key: ${{ steps.detect.outputs.frontend_key }}
      cms_key: ${{ steps.detect.outputs.cms_key }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      cms_changed: ${{ steps.detect.outputs.cms_changed }}
      types_changed: ${{ steps.detect.outputs.types_changed }}
      e2e_changed: ${{ steps.detect.outputs.e2e_changed }}
      force: ${{ steps.detect.outputs.force }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Compare dependency inputs
        id: detect
        run: node scripts/ci/inputs.mjs detect
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          NEW_RELEASE: ${{ needs.version.outputs.is_new_release }}

  verify-cms-types:
    name: "Build / CMS: Verify Generated Types"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.types_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install CMS dependencies
        run: pnpm --filter cms install --frozen-lockfile
      - name: Verify committed CMS types
        run: pnpm --filter @lapuertahostels/payload-types check-payload-types

  admit-images:
    name: "Admit image requests"
    runs-on: ubuntu-latest
    needs: [detect-changes, verify-cms-types, version]
    if: >-
      !cancelled() && needs.detect-changes.result == 'success' &&
      needs.version.result == 'success' && (needs.verify-cms-types.result ==
      'success' || (needs.detect-changes.outputs.types_changed == 'false' &&
      needs.verify-cms-types.result == 'skipped'))
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.admit.outputs.current }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check current PR revision before acquiring cancellation groups
        id: admit
        run: node scripts/ci/admit-images.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  frontend-lint:
    name: "Build / Frontend: Lint"
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-build-push]
    if: >-
      !cancelled() && needs.frontend-build-push.result == 'success' &&
      needs.frontend-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Run lint in frontend
        run: pnpm --filter frontend lint --max-warnings=0

  frontend-check-format:
    name: "Build / Frontend: Check Format"
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-build-push]
    if: >-
      !cancelled() && needs.frontend-build-push.result == 'success' &&
      needs.frontend-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Check format in frontend
        run: pnpm --filter frontend check-format

  frontend-typecheck:
    name: "Build / Frontend: Typecheck"
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-build-push]
    if: >-
      !cancelled() && needs.frontend-build-push.result == 'success' &&
      needs.frontend-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Run typecheck in frontend
        run: pnpm --filter frontend typecheck

  frontend-unit-tests:
    name: "Build / Frontend: Unit Tests"
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-build-push]
    if: >-
      !cancelled() && needs.frontend-build-push.result == 'success' &&
      needs.frontend-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Run unit tests in frontend
        run: pnpm --filter frontend test

  frontend-build-push:
    name: "Build / Frontend: Build and Push"
    needs: [detect-changes, verify-cms-types, version, admit-images]
    if: >-
      !cancelled() && needs.detect-changes.result == 'success' &&
      needs.version.result == 'success' && (needs.verify-cms-types.result ==
      'success' || (needs.detect-changes.outputs.types_changed == 'false' &&
      needs.verify-cms-types.result == 'skipped')) && needs.admit-images.result
      == 'success' && needs.admit-images.outputs.current == 'true'
    # Replace only this PR's image work; deployments are outside this group.
    concurrency:
      group:
        ci-image-request-frontend-${{ github.event.pull_request.number ||
        github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/prepare-image.yml
    with:
      app: frontend
      image_app: ${{ vars.FLY_STAGING_FRONTEND_APP }}
      image_key: ${{ needs.detect-changes.outputs.frontend_key }}
      image_tag: v${{ needs.version.outputs.version_with_sha }}
      app_version: ${{ needs.version.outputs.version }}
      changed: ${{ needs.detect-changes.outputs.frontend_changed == 'true' }}
      force_rebuild: ${{ needs.detect-changes.outputs.force == 'true' }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  frontend-publish-chromatic:
    name: "Build / Frontend: Publish to Chromatic"
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-build-push]
    if: >-
      !cancelled() && needs.frontend-build-push.result == 'success' &&
      needs.frontend-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies for frontend
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Publish frontend to Chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitOnceUploaded: true
          workingDir: apps/frontend
          storybookBaseDir: apps/frontend
        env:
          STORYBOOK_IMAGEKIT_BASE_URL: ${{ vars.STORYBOOK_IMAGEKIT_BASE_URL }}
          STORYBOOK_USE_IMAGE_CACHE_BUSTER: true
          STORYBOOK_GOOGLE_MAPS_API_KEY:
            ${{ secrets.PREVIEW_GOOGLE_MAPS_API_KEY }}

  cms-lint:
    name: "Build / CMS: Lint"
    runs-on: ubuntu-latest
    needs: [detect-changes, cms-build-push]
    if: >-
      !cancelled() && needs.cms-build-push.result == 'success' &&
      needs.cms-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cms install --frozen-lockfile
      - name: Run lint
        run: pnpm --filter cms lint --max-warnings=0

  cms-check-format:
    name: "Build / CMS: Check Format"
    runs-on: ubuntu-latest
    needs: [detect-changes, cms-build-push]
    if: >-
      !cancelled() && needs.cms-build-push.result == 'success' &&
      needs.cms-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cms install --frozen-lockfile
      - name: Check format in frontend
        run: pnpm --filter cms check-format

  cms-typecheck:
    name: "Build / CMS: Typecheck"
    runs-on: ubuntu-latest
    needs: [detect-changes, cms-build-push]
    if: >-
      !cancelled() && needs.cms-build-push.result == 'success' &&
      needs.cms-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cms install --frozen-lockfile
      - name: Generate admin import map
        run: pnpm --filter cms generate:importmap
      - name: Run native typecheck in CMS
        run: pnpm --filter cms typecheck

  cms-unit-tests:
    name: "Build / CMS: Unit Tests"
    runs-on: ubuntu-latest
    needs: [detect-changes, cms-build-push]
    if: >-
      !cancelled() && needs.cms-build-push.result == 'success' &&
      needs.cms-build-push.outputs.checks == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --filter cms install --frozen-lockfile
      - name: Run unit tests in CMS
        run: pnpm --filter cms test

  cms-build-push:
    name: "Build / CMS: Build and Push"
    needs: [detect-changes, verify-cms-types, version, admit-images]
    if: >-
      !cancelled() && needs.detect-changes.result == 'success' &&
      needs.version.result == 'success' && (needs.verify-cms-types.result ==
      'success' || (needs.detect-changes.outputs.types_changed == 'false' &&
      needs.verify-cms-types.result == 'skipped')) && needs.admit-images.result
      == 'success' && needs.admit-images.outputs.current == 'true'
    # Replace only this PR's image work; deployments are outside this group.
    concurrency:
      group:
        ci-image-request-cms-${{ github.event.pull_request.number ||
        github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/prepare-image.yml
    with:
      app: cms
      image_app: ${{ vars.FLY_STAGING_CMS_APP }}
      image_key: ${{ needs.detect-changes.outputs.cms_key }}
      image_tag: v${{ needs.version.outputs.version_with_sha }}
      app_version: ${{ needs.version.outputs.version }}
      changed: ${{ needs.detect-changes.outputs.cms_changed == 'true' }}
      force_rebuild: ${{ needs.detect-changes.outputs.force == 'true' }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  e2e-tests:
    name: Build / End-to-End Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs:
      [
        ci-tests,
        detect-changes,
        verify-cms-types,
        admit-images,
        version,
        frontend-build-push,
        cms-build-push,
      ]
    # Keep the existing required E2E check red for failed prerequisites.
    if: >-
      !cancelled() && (contains(needs.*.result, 'failure') ||
      needs.ci-tests.result != 'success' || needs.frontend-build-push.result !=
      'success' || needs.cms-build-push.result != 'success' ||
      needs.detect-changes.outputs.e2e_changed == 'true' ||
      needs.frontend-build-push.outputs.checks == 'true' ||
      needs.cms-build-push.outputs.checks == 'true')
    env:
      CMS_API_KEY: e2e-tests-apikey
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Require successful prerequisite jobs
        run: node scripts/ci/gate.mjs prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies for e2e
        run: pnpm --filter e2e install --frozen-lockfile
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
        with:
          version: ${{ env.FLYCTL_VERSION }}
      - name: Authenticate Fly.io Docker registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Wait for Fly registry images
        run: |
          set -euo pipefail

          IMAGES=("$FRONTEND_IMAGE" "$CMS_IMAGE")
          MAX_ATTEMPTS=24
          SLEEP_SECONDS=15

          for IMAGE in "${IMAGES[@]}"; do
            LAST_ERROR=""

            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              ERROR_FILE="$(mktemp)"
              if timeout 20s docker manifest inspect "$IMAGE" > /dev/null 2>"$ERROR_FILE"; then
                rm -f "$ERROR_FILE"
                echo "Image is available: $IMAGE"
                break
              fi

              ERROR_TEXT="$(tr '\n' ' ' < "$ERROR_FILE" | sed -E 's/[[:space:]]+/ /g')"
              rm -f "$ERROR_FILE"
              LAST_ERROR="$ERROR_TEXT"

              if printf '%s' "$ERROR_TEXT" | grep -Eiq '(unauthorized|authentication required|denied|forbidden|insufficient_scope|access denied)'; then
                echo "Registry auth/permission error while checking image: $IMAGE"
                echo "docker manifest inspect error: $ERROR_TEXT"
                exit 1
              fi

              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "[$attempt/$MAX_ATTEMPTS] Waiting for image: $IMAGE"
                sleep "$SLEEP_SECONDS"
              else
                echo "Timed out waiting for image: $IMAGE"
                if [ -n "$LAST_ERROR" ]; then
                  echo "Last docker manifest inspect error: $LAST_ERROR"
                fi
                exit 1
              fi
            done
          done
        env:
          FRONTEND_IMAGE: ${{ needs.frontend-build-push.outputs.digest }}
          CMS_IMAGE: ${{ needs.cms-build-push.outputs.digest }}
      - name: Start services
        run: docker compose up -d && sleep 3
        env:
          FRONTEND_IMAGE: ${{ needs.frontend-build-push.outputs.digest }}
          CMS_API_KEY: ${{ env.CMS_API_KEY }}
          SESSION_SECRET: $(openssl rand -hex 12)
          CMS_IMAGE: ${{ needs.cms-build-push.outputs.digest }}
          PAYLOAD_SECRET: $(openssl rand -hex 12)
          MEDIA_S3_BUCKET: ${{ vars.E2E_TESTS_MEDIA_S3_BUCKET }}
          MEDIA_S3_REGION: ${{ vars.E2E_TESTS_MEDIA_S3_REGION }}
          MEDIA_S3_ACCESS_KEY_ID:
            ${{ secrets.E2E_TESTS_MEDIA_S3_ACCESS_KEY_ID }}
          MEDIA_S3_SECRET_ACCESS_KEY:
            ${{ secrets.E2E_TESTS_MEDIA_S3_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.E2E_TESTS_OPENAI_API_KEY }}
          IMAGEKIT_BASE_URL: ${{ vars.E2E_TESTS_IMAGEKIT_BASE_URL }}
        working-directory: tests/e2e
      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm list @playwright/test --depth=0 --json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0].devDependencies["@playwright/test"].version')
          echo "playwright_version=${PLAYWRIGHT_VERSION}" >> $GITHUB_OUTPUT
        working-directory: tests/e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key:
            ${{ runner.os }}-playwright-${{
            steps.playwright-version.outputs.playwright_version }}
      - name: Install Playwright dependencies
        run: pnpm playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
      - name: Run native typecheck in E2E
        run: pnpm --filter e2e typecheck
      - name: Run e2e tests
        run: pnpm playwright test
        working-directory: tests/e2e
        env:
          FRONTEND_BASE_URL: http://localhost:${{ env.FRONTEND_INTERNAL_PORT }}
          CMS_BASE_URL: http://localhost:${{ env.CMS_INTERNAL_PORT }}
          CMS_API_KEY: ${{ env.CMS_API_KEY }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 30

  ci-result:
    name: "Build / Result"
    if: always()
    runs-on: ubuntu-latest
    needs:
      - version
      - ci-tests
      - detect-changes
      - verify-cms-types
      - admit-images
      - frontend-build-push
      - cms-build-push
      - frontend-lint
      - frontend-check-format
      - frontend-typecheck
      - frontend-unit-tests
      - frontend-publish-chromatic
      - cms-lint
      - cms-check-format
      - cms-typecheck
      - cms-unit-tests
      - e2e-tests
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require successful affected jobs
        id: gate
        run: |
          node scripts/ci/gate.mjs
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
        env:
          NEEDS: ${{ toJSON(needs) }}
          DEPLOY: >-
            ${{ needs.detect-changes.outputs.e2e_changed == 'true' ||
            needs.frontend-build-push.outputs.checks == 'true' ||
            needs.cms-build-push.outputs.checks == 'true' }}

      - name: Set up Docker Buildx
        if:
          needs.frontend-build-push.outputs.built == 'true' ||
          needs.cms-build-push.outputs.built == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Authenticate Fly registry
        if:
          needs.frontend-build-push.outputs.built == 'true' ||
          needs.cms-build-push.outputs.built == 'true'
        uses: docker/login-action@v4
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - name: Publish validated images to reuse cache
        if:
          needs.frontend-build-push.outputs.built == 'true' ||
          needs.cms-build-push.outputs.built == 'true'
        run: node scripts/ci/images.mjs promote
        env:
          NEEDS: ${{ toJSON(needs) }}

  deploy:
    name: Deploy
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.ci-result.result == 'success' && needs.ci-result.outputs.deploy ==
      'true'
    needs: [version, ci-result, frontend-build-push, cms-build-push]
    uses: ./.github/workflows/deploy-version.yml
    with:
      version_with_sha: ${{ needs.version.outputs.version_with_sha }}
      frontend_image: ${{ needs.frontend-build-push.outputs.digest }}
      cms_image: ${{ needs.cms-build-push.outputs.digest }}
      sha: ${{ needs.version.outputs.sha }}
      environment: staging
    secrets: inherit

  deploy-preview:
    name: Deploy Preview
    # Hold this lock across provisioning and both app deployments.
    concurrency:
      group: fly-preview-lifecycle
      queue: max
      cancel-in-progress: false
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.ci-result.result == 'success' && needs.ci-result.outputs.deploy ==
      'true'
    needs: [version, ci-result, frontend-build-push, cms-build-push]
    uses: ./.github/workflows/deploy-version.yml
    with:
      version_with_sha: ${{ needs.version.outputs.version_with_sha }}
      frontend_image: ${{ needs.frontend-build-push.outputs.digest }}
      cms_image: ${{ needs.cms-build-push.outputs.digest }}
      sha: ${{ needs.version.outputs.sha }}
      environment: preview
      high_availability: false
    secrets: inherit

  create-release:
    name: Create release
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.is_new_release == 'true'
    needs: [deploy, version]
    permissions:
      contents: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm --workspace-root install --frozen-lockfile
      - name: Create release
        run: |
          pnpm releaser publish ${{ needs.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  clean-preview:
    name: Clean Preview Apps
    if: ${{ !cancelled() && needs.deploy-preview.result == 'success' }}
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    # Keep the workflow and its checked-out helper on the same trusted revision.
    uses: fxmkdev/lapuertahostels/.github/workflows/clean-preview-reusable.yml@main
    secrets: inherit
    needs: deploy-preview
