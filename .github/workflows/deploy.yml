name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: "staging"
        options:
          - staging
          - production
      snapshot_id:
        description: "Optional pinned snapshot ID for staging recovery"
        type: string
        default: ""

jobs:
  version:
    name: "Generate version"
    uses: ./.github/workflows/version.yml

  deploy-version:
    name: "Deploy version"
    permissions:
      contents: read
      actions: read
    needs: version
    uses: ./.github/workflows/deploy-version.yml
    with:
      version_with_sha: ${{ needs.version.outputs.version_with_sha }}
      sha: ${{ needs.version.outputs.sha }}
      environment: ${{ inputs.environment }}
      snapshot_id: ${{ inputs.snapshot_id }}
    secrets: inherit
