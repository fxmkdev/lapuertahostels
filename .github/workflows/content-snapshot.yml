name: Publish Content Snapshot
on:
  workflow_dispatch:

concurrency:
  group: fly-production-lifecycle
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    # Never run publisher orchestration checked out from a PR or other branch.
    if:
      github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production-cms
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: superfly/flyctl-actions/setup-flyctl@v1
        with:
          version: 0.5.11
      - name: Publish using the currently deployed production image
        id: publish
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SNAPSHOT_PRODUCTION_APP:
            ${{ vars.SNAPSHOT_PRODUCTION_APP || 'lapuertahostels-cms' }}
        run: node scripts/ci/content-snapshots.mjs publish
      - name: Clean up the publisher after cancellation or failure
        if:
          ${{ always() && steps.publish.outcome != 'skipped' &&
          steps.publish.outcome != '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SNAPSHOT_PRODUCTION_APP:
            ${{ vars.SNAPSHOT_PRODUCTION_APP || 'lapuertahostels-cms' }}
        run: node scripts/ci/content-snapshots.mjs cleanup-publisher
