name: Clean Preview
on:
  workflow_call:

env:
  FLYCTL_VERSION: 0.5.11

jobs:
  clean-preview:
    name: Clean Preview
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    # Use the deployment group before listing or deleting preview apps.
    concurrency:
      group: fly-preview-lifecycle
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted cleanup code
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
        with:
          version: ${{ env.FLYCTL_VERSION }}
      - name: Clean up preview apps
        run: node scripts/ci/clean-preview.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
          FLY_PREVIEW_FRONTEND_APP_PREFIX:
            ${{ vars.FLY_PREVIEW_FRONTEND_APP_PREFIX }}
          FLY_PREVIEW_CMS_APP_PREFIX: ${{ vars.FLY_PREVIEW_CMS_APP_PREFIX }}
