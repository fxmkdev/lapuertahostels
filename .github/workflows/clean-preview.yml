name: Clean Preview
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request_target:
    types: [closed]

jobs:
  clean-preview:
    name: Clean Preview
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    # Keep the workflow and its checked-out helper on the same trusted revision.
    uses: fxmkdev/lapuertahostels/.github/workflows/clean-preview-reusable.yml@main
    secrets: inherit
