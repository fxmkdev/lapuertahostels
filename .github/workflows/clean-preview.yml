name: Clean Preview
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request_target:
    types: [closed]

jobs:
  clean-preview:
    name: Clean Preview
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    uses: ./.github/workflows/clean-preview-reusable.yml
    secrets: inherit
