#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '$FLY_APP'
primary_region = '$FLY_PRIMARY_REGION'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = $FLY_MIN_MACHINES_RUNNING
  processes = ['app']

[[vm]]
  memory = $FLY_MEMORY
  cpu_kind = '$FLY_CPU_KIND'
  cpus = $FLY_CPUS
  
[deploy]
  release_command = "node apps/cms/scripts/content-snapshots/cli.mjs release"
  release_command_timeout = "30m"

[env]
  DEPLOYMENT_ENVIRONMENT = '$DEPLOYMENT_ENVIRONMENT'
  SNAPSHOT_RESTORE_ENABLED = '$SNAPSHOT_RESTORE_ENABLED'
  SNAPSHOT_ID = '$SNAPSHOT_ID'
  SNAPSHOT_TARGET_DATABASE = '$SNAPSHOT_TARGET_DATABASE'
  SNAPSHOT_PRODUCTION_APP = '$SNAPSHOT_PRODUCTION_APP'
  SNAPSHOT_STAGING_APP = '$SNAPSHOT_STAGING_APP'
  SNAPSHOT_PREVIEW_APP_PREFIX = '$SNAPSHOT_PREVIEW_APP_PREFIX'
  SNAPSHOT_ENDPOINT = '$SNAPSHOT_ENDPOINT'
  SNAPSHOT_REGION = '$SNAPSHOT_REGION'
  SNAPSHOT_BUCKET = '$SNAPSHOT_BUCKET'
  MEDIA_S3_ENDPOINT = '$MEDIA_S3_ENDPOINT'
  MEDIA_S3_REGION = '$MEDIA_S3_REGION'
  MEDIA_S3_BUCKET = '$MEDIA_S3_BUCKET'
  LIVE_PREVIEW_URL = '$LIVE_PREVIEW_URL'
  FRONTEND_CACHE_INVALIDATION_URL = '$FRONTEND_CACHE_INVALIDATION_URL'
  IMAGEKIT_BASE_URL = '$IMAGEKIT_BASE_URL'
  SERVER_URL = '$SERVER_URL'
  CMS_VERBOSE_SERVER_ERRORS = '$CMS_VERBOSE_SERVER_ERRORS'
  NODE_OPTIONS = '$NODE_OPTIONS'
